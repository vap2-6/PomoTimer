<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye-Soothing Aesthetic</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            width: 400px;
            height: 400px;
            animation: float 6s ease-in-out infinite;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.7;
            animation: pulse 4s ease-in-out infinite;
        }

        .circle1 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 70%);
            top: 50px;
            left: 100px;
            animation-delay: 0s;
        }

        .circle2 {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.4) 0%, rgba(255, 182, 193, 0) 70%);
            top: 150px;
            left: 50px;
            animation-delay: 1s;
        }

        .circle3 {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(173, 216, 230, 0.4) 0%, rgba(173, 216, 230, 0) 70%);
            top: 100px;
            left: 200px;
            animation-delay: 2s;
        }

        .circle4 {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(221, 160, 221, 0.4) 0%, rgba(221, 160, 221, 0) 70%);
            top: 250px;
            left: 150px;
            animation-delay: 1.5s;
        }

        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 3px;
            text-align: center;
            z-index: 10;
            animation: fadeIn 3s ease-in-out infinite alternate;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.4;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: drift 20s infinite;
        }

        @keyframes drift {
            0% {
                transform: translateX(-100px) translateY(0px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(100px) translateY(-100px);
                opacity: 0;
            }
        }

        .particle:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 60%; left: 20%; animation-delay: 3s; }
        .particle:nth-child(3) { top: 80%; left: 70%; animation-delay: 5s; }
        .particle:nth-child(4) { top: 40%; left: 80%; animation-delay: 7s; }
        .particle:nth-child(5) { top: 90%; left: 40%; animation-delay: 9s; }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        <div class="circle circle4"></div>
        <div class="text">breathe</div>
    </div>
</body>
</html>
